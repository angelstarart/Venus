server {
    listen 80;
    server_name angelstar.art www.angelstar.art;

    location /.well-known/acme-challenge/ {
        alias /home/ec2-user/venus/packages/server/routes/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

