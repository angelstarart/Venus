services:
  web:
    container_name: node
#    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        user: $USER
        pass: $PASS
    privileged: true
    restart: always
    env_file: ./.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./packages:/home/ec2-user/venus/packages
      - certbot-www:/home/ec2-user/venus/packages/server/routes
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - db
      - certbot
    networks:
      - web-db

  certbot:
    container_name: certbot
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-www:/home/ec2-user/venus/packages/server/routes
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  db:
    container_name: mongodb
    image: mongo:latest
    restart: always
    env_file: ./.env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=$USER
      - MONGO_INITDB_ROOT_PASSWORD=$PASS
      - MONGO_INITDB_DATABASE=$USER
    ports:
      - '27017:27017'
    expose:
      - 27017
    volumes:
       - mongodb:/data/db
#       - ./init-mongodb:/docker-entrypoint-initdb.d
    command: [--auth]
    networks:
      - web-db

volumes:
  mongodb:
  certbot-www:
  certbot-conf:

networks:
  web-db:
